# Sink Settigns
debezium.sink.type=rabbitmq
debezium.sink.rabbitmq.connection.host=${RABBITMQ_HOST}
debezium.sink.rabbitmq.connection.port=${RABBITMQ_PORT}
debezium.sink.rabbitmq.connection.username=${RABBITMQ_USER}
debezium.sink.rabbitmq.connection.password=${RABBITMQ_PASSWORD}
debezium.sink.rabbitmq.connection.virtual.host=${RABBITMQ_VHOST}
debezium.sink.rabbitmq.routingKey.source=static
debezium.sink.rabbitmq.exchange=payments
debezium.sink.rabbitmq.routingKey=payments.new

# Source Settings
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=0
debezium.source.database.hostname=${POSTGRESQL_HOST}
debezium.source.database.port=5432
debezium.source.database.user=${POSTGRESQL_USER}
debezium.source.database.password=${POSTGRESQL_PASSWORD}
debezium.source.database.dbname=${POSTGRESQL_DB}
debezium.source.topic.prefix=tutorial
debezium.source.table.include.list=public.outbox
debezium.source.plugin.name=pgoutput
debezium.source.tombstones.on.delete=false

debezium.transforms=filter,outbox

## FILTER CONFIG
debezium.transforms.filter.type=io.debezium.transforms.Filter
debezium.transforms.filter.language=jsr223.groovy
debezium.transforms.filter.condition=value.schema().field("op") && value.getString("op") == "c"

## OUTBOX CONFIG
debezium.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.transforms.outbox.table.field.event.payload=payload
debezium.transforms.outbox.table.expand.json.payload=true
debezium.transforms.outbox.table.json.payload.null.behavior=ignore
debezium.transforms.outbox.table.fields.additional.error.on.missing=true
debezium.transforms.outbox.route.tombstone.on.empty.payload=false
debezium.transforms.outbox.table.op.invalid.behavior=error

# Quarkus configuration
quarkus.log.level=ERROR
quarkus.log.console.json=false

debezium.format.value.schemas.enable=false

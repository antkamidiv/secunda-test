[project]
name = "worker"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "asyncpg>=0.32.0",
    "faststream[cli,rabbit]>=0.7.7",
    "pydantic-settings>=2.16.0",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.2",
]

[[tool.mypy.overrides]]
module = ["asyncpg",]
ignore_missing_imports = true

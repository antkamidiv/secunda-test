services:

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_NODE_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-vhost}
    ports:
      - "${RABBITMQ_PORT:-5672}:${RABBITMQ_PORT:-5672}"
      - "15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  postgresql:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRESQL_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRESQL_DB:-postgres}
    ports:
      - "${POSTGRESQL_PORT:-5432}:${POSTGRESQL_PORT:-5432}"
    volumes:
      - pgdata:/var/lib/postgresql
    command: [ "postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:${REDIS_PORT:-6379}"
    volumes:
      - redisdata:/data
    command: [ "redis-server", "--port", "${REDIS_PORT:-6379}", "--requirepass", "${REDIS_PASSWORD}" ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD -p $$REDIS_PORT ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  debezium:
    image: quay.io/debezium/server:latest
    env_file: .env
    environment:
      ENABLE_DEBEZIUM_SCRIPTING: true
      DEBEZIUM_SINK_RABBITMQ_CONNECTION_HOST: rabbitmq
      DEBEZIUM_SOURCE_DATABASE_HOSTNAME: postgresql
    ports:
      - 8080:8080
    volumes:
      - ./debezium/config/application.properties:/debezium/config/application.properties:ro
      - debeziumdata:/debezium/data
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  migrations:
    build:
      context: ./payments
      dockerfile: Dockerfile.migrate
    env_file: .env
    environment:
      POSTGRESQL_HOST: postgresql
    depends_on:
      postgresql:
        condition: service_healthy

  gateway:
    build:
      context: ./payments
      dockerfile: Dockerfile
    env_file: .env
    environment: &infra_hosts
      POSTGRESQL_HOST: postgresql
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    depends_on: &infra_depends
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    env_file: .env
    environment: *infra_hosts
    depends_on: *infra_depends
    restart: unless-stopped

volumes:
  rabbitdata:
  pgdata:
  redisdata:
  debeziumdata:
